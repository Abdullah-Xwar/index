```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Heart</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#181818;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const points = [];

for(let t = 0; t < Math.PI * 2; t += 0.05){

    const x = 16 * Math.pow(Math.sin(t),3);

    const y = -(
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t)
    );

    points.push({
        x,
        y,
        visible:false,
        opacity:0
    });
}

let current = 0;

const createHeart = setInterval(() => {

    if(current < points.length){
        points[current].visible = true;
        current++;
    }else{
        clearInterval(createHeart);
    }

},80);

function draw(time){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Çok yumuşak kalp atışı
    const scale = 20 + Math.sin(time * 0.0015) * 0.8;

    points.forEach(point => {

        if(!point.visible) return;

        if(point.opacity < 1){
            point.opacity += 0.015;
        }

        const x = canvas.width/2 + point.x * scale;
        const y = canvas.height/2 + point.y * scale;

        ctx.globalAlpha = point.opacity;
        ctx.fillStyle = "#ff8fbe";
        ctx.font = "16px Arial";
        ctx.textAlign = "center";

        ctx.fillText("I LOVE YOU", x, y);
    });

    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>

</body>
</html>
